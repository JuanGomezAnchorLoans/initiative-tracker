<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">
  <div class="tabstrip">
    <span class="tab tab-active">PROJECT BOARD</span>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <h1 class="board-title" id="boardTitle" contenteditable="true" spellcheck="false">Project Board</h1>
    </div>
    <div class="topbar-right">
      <span class="sync-status" id="syncStatus">Loading…</span>
      <button class="icon-btn" id="refreshBtn" title="Refresh now" aria-label="Refresh now">⟳</button>
      <button class="btn-primary" id="addProjectBtn">+ Project</button>
    </div>
  </header>

  <section class="stats-row" id="statsRow"></section>

  <main class="board" id="board">
    <div class="board-empty" id="boardEmpty" hidden>Setting up your board…</div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<div id="gateOverlay" class="gate-overlay hidden">
  <div class="gate-card">
    <h2>Enter access code</h2>
    <p>This board is protected. Ask whoever set it up for the code.</p>
    <input id="gateInput" type="password" placeholder="Access code" autocomplete="off" />
    <button class="btn-primary" id="gateSubmit">Continue</button>
    <p class="gate-error hidden" id="gateError">That code didn't work. Try again.</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
