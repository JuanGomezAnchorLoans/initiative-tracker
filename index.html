<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anchor Institutional – Sales Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --border: #e4e7ec;
  --border-strong: #d0d5dd;
  --text: #101828;
  --text-muted: #667085;
  --text-faint: #98a2b3;

  --blue-100: #e7edfc;
  --blue-500: #3d6fe0;
  --blue-600: #2e5aac;
  --blue-700: #1d3f91;
  --navy-900: #0b1f3a;

  --orange-500: #dc7609;
  --orange-100: #fbead2;
  --green-600: #1d9a6c;
  --green-100: #e3f5ec;
  --gray-400: #98a2b3;
  --gray-100: #eef1f4;
  --purple-500: #7a5af8;
  --purple-100: #ece8fe;
  --pink-500: #e0559f;
  --pink-100: #fbe6f2;

  --radius: 10px;
  --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.04);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 1560px; margin: 0 auto; padding: 0 28px 40px; }

/* ---------- Masthead ---------- */
.masthead {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 26px 0 4px;
  flex-wrap: wrap;
}
.masthead-title {
  font-size: 26px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.01em;
}
.masthead-divider { color: var(--text-faint); font-size: 26px; font-weight: 800; }
.masthead-sub { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }

/* ---------- Tab strip ---------- */
.tabstrip {
  display: flex;
  gap: 28px;
  padding: 14px 0 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 22px;
}
.tab {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-faint);
  padding: 0 0 12px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-family: inherit;
}
.tab:hover { color: var(--text-muted); }
.tab-active {
  color: var(--blue-600);
  border-bottom: 2px solid var(--blue-500);
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 16px;
  flex-wrap: wrap;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.sync-status { font-size: 12px; color: var(--text-faint); }

.icon-btn {
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-muted);
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.icon-btn:not(.update-btn) { width: 32px; }
.update-btn { gap: 6px; padding: 0 12px; font-size: 13px; font-weight: 600; }
.update-btn .anchor-emoji { font-size: 15px; display: inline-block; }
.icon-btn:hover { background: var(--gray-100); }
.update-btn.anchor-toss .anchor-emoji { animation: anchorToss 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-block; transform-origin: top center; }
@keyframes anchorToss {
  0%   { transform: translateY(-10px) rotate(0deg); }
  15%  { transform: translateY(3px) rotate(-18deg); }
  30%  { transform: translateY(-2px) rotate(14deg); }
  45%  { transform: translateY(1px) rotate(-10deg); }
  60%  { transform: translateY(0) rotate(7deg); }
  75%  { transform: translateY(0) rotate(-4deg); }
  90%  { transform: translateY(0) rotate(2deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

.btn-primary {
  background: var(--navy-900);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover { background: #142a4d; }

.btn-ghost {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  padding: 4px 6px;
}
.btn-ghost:hover { color: var(--text); }

/* ---------- Stat row ---------- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 3px solid var(--stat-accent, var(--blue-500));
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 16px 18px;
}
.stat-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.stat-value { font-size: 28px; font-weight: 800; line-height: 1; }
.stat-caption { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

/* ---------- Board ---------- */
.board {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 12px;
  align-items: flex-start;
}
.board-empty { color: var(--text-faint); font-size: 14px; padding: 40px; }

.column {
  flex: 0 0 288px;
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 3px solid var(--col-accent, var(--blue-500));
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 260px);
}

.column-header { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.column-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.column-title {
  font-size: 14px;
  font-weight: 700;
  outline: none;
  border-radius: 5px;
  padding: 2px 4px;
  margin-left: -4px;
  flex: 1;
  word-break: break-word;
}
.column-title:focus { background: var(--gray-100); }
.column-menu-btn {
  background: none; border: none; color: var(--text-faint);
  cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1;
}
.column-menu-btn:hover { color: #d92d20; }

.column-meta { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.meta-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.meta-label { color: var(--text-faint); text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; width: 40px; flex-shrink: 0; }
.meta-value {
  outline: none;
  border-radius: 4px;
  padding: 1px 4px;
  margin-left: -4px;
  cursor: text;
  min-width: 20px;
}
.meta-value:hover, .meta-value:focus { background: var(--gray-100); }
.meta-value.placeholder { color: var(--text-faint); font-style: italic; }
.meta-value.overdue { color: #d92d20; font-weight: 600; }

.subtask-list { flex: 1; overflow-y: auto; padding: 10px 10px 4px; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.subtask-empty { color: var(--text-faint); font-size: 12px; font-style: italic; padding: 6px 4px; }

.card-item {
  background: #fbfbfc;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 10px;
  cursor: grab;
}
.card-item.dragging {
  opacity: 0.55;
  transform: rotate(1.5deg) scale(1.03);
  box-shadow: 0 10px 22px rgba(16, 24, 40, 0.18);
  cursor: grabbing;
}
.card-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
.card-btn-group { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.card-item-name {
  font-size: 13px;
  font-weight: 600;
  outline: none;
  border-radius: 4px;
  padding: 1px 3px;
  margin: -1px -3px 6px;
  word-break: break-word;
  flex: 1;
}
.card-item-name:hover, .card-item-name:focus { background: var(--gray-100); }

.card-item-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }

.card-move-btn {
  background: none; border: none; color: var(--text-muted);
  font-size: 9px; cursor: pointer; padding: 2px 3px; line-height: 1;
  border-radius: 4px;
}
.card-move-btn:hover:not(:disabled) { background: var(--gray-100); color: var(--text); }
.card-move-btn:disabled { color: var(--border-strong); cursor: not-allowed; }

.card-detail-btn {
  background: none; border: none; color: var(--text-faint);
  font-size: 12px; cursor: pointer; padding: 0 2px; line-height: 1;
  opacity: 0; transition: opacity 0.1s;
}
.card-item:hover .card-detail-btn { opacity: 1; }
.card-detail-btn:hover { color: var(--blue-600); }

.card-due {
  font-size: 11px; color: var(--text-faint);
  border: none; background: transparent; cursor: pointer; padding: 1px 2px; border-radius: 4px;
  font-family: inherit;
}
.card-due:hover { background: var(--gray-100); }
.card-due.overdue { color: #d92d20; font-weight: 600; }

.status-pill {
  border: none;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 3px 8px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-position: right 6px center;
  width: 100%;
  margin-top: 8px;
  text-align: center;
}
.status-not-started { background: var(--gray-100); color: #475467; }
.status-in-progress { background: var(--blue-100); color: var(--blue-700); }
.status-completed { background: var(--green-100); color: var(--green-600); }

.card-delete {
  background: none; border: none; color: var(--text-faint);
  font-size: 12px; cursor: pointer; padding: 0 2px; line-height: 1;
  opacity: 0; transition: opacity 0.1s;
}
.card-item:hover .card-delete { opacity: 1; }
.card-delete:hover { color: #d92d20; }

.add-subtask-btn {
  margin: 4px 10px 10px;
  padding: 7px 8px;
  border-radius: 7px;
  border: 1px dashed var(--border-strong);
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  text-align: left;
}
.add-subtask-btn:hover { background: var(--gray-100); border-color: var(--text-faint); }

.column.ghost {
  flex: 0 0 220px;
  border: 1px dashed var(--border-strong);
  border-top: 1px dashed var(--border-strong);
  box-shadow: none;
  align-items: center;
  justify-content: center;
  display: flex;
  min-height: 120px;
  background: transparent;
}
.ghost-btn {
  background: none; border: none;
  color: var(--text-muted); font-size: 13px; font-weight: 600;
  cursor: pointer; padding: 10px 16px;
}
.ghost-btn:hover { color: var(--blue-600); }

/* inline new-project input */
.new-column-form { padding: 14px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
.new-column-form input {
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  padding: 7px 9px;
  font-size: 13px;
  font-family: inherit;
}
.new-column-form-actions { display: flex; gap: 8px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  background: var(--navy-900);
  color: #fff;
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  z-index: 50;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 8px); }
.toast.error { background: #b42318; }

/* ---------- Access gate ---------- */
.gate-overlay {
  position: fixed; inset: 0;
  background: rgba(16, 24, 40, 0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.gate-overlay.hidden { display: none; }
.gate-card {
  background: #fff;
  border-radius: 12px;
  padding: 28px;
  width: 300px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.2);
}
.gate-card h2 { margin: 0 0 6px; font-size: 17px; }
.gate-card p { margin: 0 0 14px; font-size: 13px; color: var(--text-muted); }
.gate-card input {
  width: 100%; padding: 9px 10px; border: 1px solid var(--border-strong);
  border-radius: 7px; font-size: 14px; margin-bottom: 10px; font-family: inherit;
}
.gate-card .btn-primary { width: 100%; padding: 9px; }
.gate-error { color: #d92d20; font-size: 12px; margin-top: 8px; }
.gate-error.hidden { display: none; }

/* ---------- My Tasks tab ---------- */
.my-tasks { display: flex; flex-direction: column; gap: 18px; }

.owner-filter { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.owner-filter-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin-right: 4px; }
.owner-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--border-strong);
  background: var(--card);
  color: var(--text-muted);
  border-radius: 999px;
  padding: 5px 14px 5px 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.owner-pill.active {
  background: var(--navy-900);
  border-color: var(--navy-900);
  color: #fff;
}
.owner-pill:hover:not(.active) { background: var(--gray-100); }

.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-list-empty {
  color: var(--text-faint);
  font-size: 14px;
  padding: 40px;
  text-align: center;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}

.task-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto auto;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 9px;
  box-shadow: var(--shadow-card);
  padding: 12px 14px;
}
.task-row-name { font-size: 14px; font-weight: 600; }
.task-row-project {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--gray-100);
  border-radius: 999px;
  padding: 4px 10px;
  white-space: nowrap;
}
.task-row-owner { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.task-row-due {
  font-size: 12px;
  color: var(--text-faint);
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.task-row-due.overdue { color: #d92d20; font-weight: 600; }
.task-row .status-pill { width: auto; margin-top: 0; padding: 4px 10px; }

@media (max-width: 720px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  #app { padding: 0 14px 30px; }
  .task-row { grid-template-columns: 1fr; justify-items: start; }
}

/* ---------- Avatar chips & owner picker ---------- */
.avatar-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--chip-color, var(--text-faint));
  color: var(--chip-color, var(--text-faint));
  background: #fff;
  font-size: 9px;
  font-weight: 800;
  font-family: inherit;
  flex-shrink: 0;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--chip-color, transparent) 12%, transparent);
}

.owner-picker { position: relative; display: inline-flex; }
.owner-picker-trigger {
  display: flex;
  align-items: center;
  gap: -6px;
  border: none;
  background: none;
  cursor: pointer;
  padding: 2px;
  border-radius: 999px;
}
.owner-picker-trigger .avatar-chip:not(:first-child) { margin-left: -8px; }
.owner-picker-trigger:hover { background: var(--gray-100); }
.owner-picker-placeholder { font-size: 11px; color: var(--text-faint); font-style: italic; padding: 2px 4px; }

.owner-picker-panel {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 30;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(16, 24, 40, 0.12);
  padding: 6px;
  min-width: 180px;
}
.owner-picker-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
}
.owner-picker-row:hover { background: var(--gray-100); }
.owner-picker-row.selected { background: var(--blue-100); }

/* ---------- Task detail modal ---------- */
.detail-overlay {
  position: fixed; inset: 0;
  background: rgba(16, 24, 40, 0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 90;
  padding: 20px;
}
.detail-card {
  background: #fff;
  border-radius: 14px;
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 22px;
  box-shadow: 0 20px 48px rgba(0,0,0,0.22);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.detail-header { display: flex; align-items: center; gap: 10px; }
.detail-name-input {
  flex: 1;
  font-size: 17px;
  font-weight: 700;
  border: none;
  outline: none;
  font-family: inherit;
  border-radius: 6px;
  padding: 4px 6px;
  margin-left: -6px;
}
.detail-name-input:focus { background: var(--gray-100); }

.detail-meta-row { display: flex; gap: 22px; flex-wrap: wrap; }
.detail-meta-block { display: flex; flex-direction: column; gap: 6px; }
.detail-label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); }
.detail-date-input {
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  padding: 6px 8px;
  font-size: 13px;
  font-family: inherit;
}
.detail-project-select {
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  padding: 6px 8px;
  font-size: 13px;
  font-family: inherit;
  max-width: 200px;
}
.detail-meta-block .status-pill { width: auto; margin-top: 0; padding: 5px 12px; }

.detail-textarea {
  width: 100%;
  min-height: 90px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  font-family: inherit;
  resize: vertical;
}
.detail-links { display: flex; flex-direction: column; gap: 8px; }
.detail-link-row { display: flex; gap: 8px; }
.detail-link-row input {
  flex: 1;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  padding: 7px 9px;
  font-size: 13px;
  font-family: inherit;
}
.link-remove-btn {
  background: none; border: none; color: var(--text-faint);
  cursor: pointer; font-size: 13px; padding: 0 4px;
}
.link-remove-btn:hover { color: #d92d20; }

</style>
</head>
<body>

<div id="app">
  <div class="masthead">
    <h1 class="masthead-title">Anchor Institutional</h1>
    <span class="masthead-divider">—</span>
    <span class="masthead-sub">Sales Ops Dashboard</span>
  </div>

  <div class="tabstrip">
    <button class="tab tab-active" id="tabBoard" data-tab="board">INITIATIVES TRACKER</button>
    <button class="tab" id="tabTasks" data-tab="tasks">MY TASKS</button>
  </div>

  <header class="topbar">
    <div class="topbar-left"></div>
    <div class="topbar-right">
      <span class="sync-status" id="syncStatus">Loading…</span>
      <button class="icon-btn update-btn" id="refreshBtn" title="Update" aria-label="Update">
        <span class="anchor-emoji">⚓</span><span>Update</span>
      </button>
      <button class="btn-primary" id="addProjectBtn">+ Project</button>
    </div>
  </header>

  <section class="stats-row" id="statsRow"></section>

  <main class="board" id="board">
    <div class="board-empty" id="boardEmpty" hidden>Setting up your board…</div>
  </main>

  <section class="my-tasks" id="myTasksView" hidden>
    <div class="owner-filter" id="ownerFilter"></div>
    <div class="task-list" id="taskList"></div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>

<div id="gateOverlay" class="gate-overlay hidden">
  <div class="gate-card">
    <h2>Enter access code</h2>
    <p>This board is protected. Ask whoever set it up for the code.</p>
    <input id="gateInput" type="password" placeholder="Access code" autocomplete="off" />
    <button class="btn-primary" id="gateSubmit">Continue</button>
    <p class="gate-error hidden" id="gateError">That code didn't work. Try again.</p>
  </div>
</div>

<script>
(() => {
  'use strict';

  const POLL_MS = 20000;
  const COLOR_CYCLE = ['Blue', 'Orange', 'Green', 'Purple', 'Pink', 'Gray'];
  const COLOR_VARS = {
    Blue: 'var(--blue-500)',
    Orange: 'var(--orange-500)',
    Green: 'var(--green-600)',
    Purple: 'var(--purple-500)',
    Pink: 'var(--pink-500)',
    Gray: 'var(--gray-400)',
  };
  const STAT_ACCENTS = ['var(--blue-500)', 'var(--navy-900)', 'var(--orange-500)', 'var(--green-600)'];
  const STATUSES = ['Not Started', 'In Progress', 'Completed'];
  const USERS = [
    { id: 'ML', name: 'Maria Lombana', initials: 'ML', color: '#8B5CF6' },
    { id: 'SN', name: 'Santiago Navas', initials: 'SN', color: '#2E7BF6' },
    { id: 'JG', name: 'Juan Gómez', initials: 'JG', color: '#10B981' },
  ];

  const els = {
    board: document.getElementById('board'),
    boardEmpty: document.getElementById('boardEmpty'),
    statsRow: document.getElementById('statsRow'),
    syncStatus: document.getElementById('syncStatus'),
    refreshBtn: document.getElementById('refreshBtn'),
    addProjectBtn: document.getElementById('addProjectBtn'),
    toast: document.getElementById('toast'),
    gateOverlay: document.getElementById('gateOverlay'),
    gateInput: document.getElementById('gateInput'),
    gateSubmit: document.getElementById('gateSubmit'),
    gateError: document.getElementById('gateError'),
    tabBoard: document.getElementById('tabBoard'),
    tabTasks: document.getElementById('tabTasks'),
    myTasksView: document.getElementById('myTasksView'),
    ownerFilter: document.getElementById('ownerFilter'),
    taskList: document.getElementById('taskList'),
  };

  let state = { projects: [], subtasks: [] };
  let addingColumn = false;
  let activeTab = 'board';
  let selectedOwners = new Set(USERS.map((u) => u.id));

  // ---------- API ----------

  function boardKey() {
    return localStorage.getItem('board_access_code') || '';
  }

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'x-board-key': boardKey(),
        ...(options.headers || {}),
      },
    });
    if (res.status === 401) {
      showGate();
      throw new Error('Access code required');
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `Request failed (${res.status})`);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  // ---------- Gate ----------

  function showGate() {
    els.gateOverlay.classList.remove('hidden');
  }
  function hideGate() {
    els.gateOverlay.classList.add('hidden');
  }
  els.gateSubmit.addEventListener('click', async () => {
    localStorage.setItem('board_access_code', els.gateInput.value.trim());
    els.gateError.classList.add('hidden');
    try {
      await loadBoard();
      hideGate();
    } catch (e) {
      els.gateError.classList.remove('hidden');
    }
  });
  els.gateInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') els.gateSubmit.click();
  });

  // ---------- Toast ----------

  let toastTimer = null;
  function toast(message, isError = false) {
    els.toast.textContent = message;
    els.toast.classList.toggle('error', isError);
    els.toast.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.add('hidden'), 2600);
  }

  // ---------- Owner picker & avatars ----------

  function parseOwnerIds(str) {
    return (str || '').split(',').map((s) => s.trim()).filter(Boolean);
  }

  function avatarChip(userId) {
    const user = USERS.find((u) => u.id === userId);
    const chip = document.createElement('span');
    chip.className = 'avatar-chip';
    chip.textContent = user ? user.initials : '?';
    chip.style.setProperty('--chip-color', user ? user.color : 'var(--text-faint)');
    chip.title = user ? user.name : 'Unknown';
    return chip;
  }

  // Builds a self-contained assignee widget: a trigger showing the current
  // avatar chips (or a "+ Assign" placeholder), and a click-to-open panel
  // listing all three team members as toggleable rows. onSave receives the
  // new comma-separated id string every time the selection changes.
  function ownerPicker(ownerString, onSave) {
    const wrap = document.createElement('div');
    wrap.className = 'owner-picker';
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'owner-picker-trigger';
    wrap.appendChild(trigger);

    let selected = new Set(parseOwnerIds(ownerString));
    let panel = null;

    function renderTrigger() {
      trigger.innerHTML = '';
      if (selected.size === 0) {
        const ph = document.createElement('span');
        ph.className = 'owner-picker-placeholder';
        ph.textContent = '+ Assign';
        trigger.appendChild(ph);
      } else {
        [...selected].forEach((id) => trigger.appendChild(avatarChip(id)));
      }
    }

    function outsideHandler(e) {
      if (!wrap.contains(e.target)) closePanel();
    }

    function closePanel() {
      if (panel) {
        panel.remove();
        panel = null;
      }
      document.removeEventListener('click', outsideHandler);
    }

    function openPanel() {
      panel = document.createElement('div');
      panel.className = 'owner-picker-panel';
      USERS.forEach((u) => {
        const row = document.createElement('div');
        row.className = 'owner-picker-row' + (selected.has(u.id) ? ' selected' : '');
        row.appendChild(avatarChip(u.id));
        const nameSpan = document.createElement('span');
        nameSpan.textContent = u.name;
        row.appendChild(nameSpan);
        row.addEventListener('click', (e) => {
          e.stopPropagation();
          if (selected.has(u.id)) selected.delete(u.id);
          else selected.add(u.id);
          row.classList.toggle('selected');
          renderTrigger();
          onSave([...selected].join(','));
        });
        panel.appendChild(row);
      });
      wrap.appendChild(panel);
      setTimeout(() => document.addEventListener('click', outsideHandler), 0);
    }

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      if (panel) closePanel();
      else openPanel();
    });

    renderTrigger();
    return wrap;
  }

  // ---------- Load & render ----------

  async function loadBoard(showAnimation = false) {
    if (showAnimation) els.refreshBtn.classList.add('anchor-toss');
    try {
      const data = await api('/api/board');
      state.projects = data.projects.sort((a, b) => a.order - b.order);
      // Preserve any already-fetched description/links cached on subtasks
      // (from opening their detail modal this session) across a reload.
      const cache = new Map(state.subtasks.map((s) => [s.id, s]));
      state.subtasks = data.subtasks
        .map((s) => {
          const prev = cache.get(s.id);
          return prev ? { ...s, description: prev.description, links: prev.links } : s;
        })
        .sort((a, b) => a.order - b.order);
      render();
      els.syncStatus.textContent = 'Synced just now';
    } catch (e) {
      if (e.message !== 'Access code required') {
        els.syncStatus.textContent = 'Sync failed';
        toast(e.message, true);
      }
    } finally {
      setTimeout(() => els.refreshBtn.classList.remove('anchor-toss'), 700);
    }
  }

  function setActiveTab(tab) {
    activeTab = tab;
    els.tabBoard.classList.toggle('tab-active', tab === 'board');
    els.tabTasks.classList.toggle('tab-active', tab === 'tasks');
    els.statsRow.hidden = tab !== 'board';
    els.board.hidden = tab !== 'board';
    els.boardEmpty.hidden = tab !== 'board' || state.projects.length > 0;
    els.addProjectBtn.hidden = tab !== 'board';
    els.myTasksView.hidden = tab !== 'tasks';
    render();
  }

  function render() {
    if (activeTab === 'board') {
      renderStats();
      renderColumns();
    } else {
      renderMyTasks();
    }
  }

  function renderStats() {
    const today = new Date().toISOString().slice(0, 10);
    const total = state.subtasks.length;
    const overdue = state.subtasks.filter((s) => s.dueDate && s.dueDate < today && s.status !== 'Completed').length;
    const completed = state.subtasks.filter((s) => s.status === 'Completed').length;
    const stats = [
      { label: 'Projects', value: state.projects.length, caption: 'Active columns' },
      { label: 'Subtasks', value: total, caption: 'Across all projects' },
      { label: 'Overdue', value: overdue, caption: 'Needs attention' },
      { label: 'Completed', value: completed, caption: total ? `${Math.round((completed / total) * 100)}% of all subtasks` : '—' },
    ];
    els.statsRow.innerHTML = '';
    stats.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.style.setProperty('--stat-accent', STAT_ACCENTS[i]);
      card.innerHTML = `
        <div class="stat-label">${s.label}</div>
        <div class="stat-value">${s.value}</div>
        <div class="stat-caption">${s.caption}</div>
      `;
      els.statsRow.appendChild(card);
    });
  }

  // ---------- My Tasks ----------

  function renderMyTasks() {
    renderOwnerFilter();
    renderTaskList();
  }

  function renderOwnerFilter() {
    els.ownerFilter.innerHTML = '';
    const label = document.createElement('span');
    label.className = 'owner-filter-label';
    label.textContent = 'Show tasks for';
    els.ownerFilter.appendChild(label);

    USERS.forEach((u) => {
      const pill = document.createElement('button');
      pill.className = 'owner-pill' + (selectedOwners.has(u.id) ? ' active' : '');
      pill.appendChild(avatarChip(u.id));
      const span = document.createElement('span');
      span.textContent = u.name;
      pill.appendChild(span);
      pill.addEventListener('click', () => {
        if (selectedOwners.has(u.id)) selectedOwners.delete(u.id);
        else selectedOwners.add(u.id);
        renderMyTasks();
      });
      els.ownerFilter.appendChild(pill);
    });
  }

  function renderTaskList() {
    els.taskList.innerHTML = '';

    const matches = state.subtasks.filter((s) => {
      if (selectedOwners.size === 0) return false;
      const ids = parseOwnerIds(s.owner);
      return ids.some((id) => selectedOwners.has(id));
    });

    matches.sort((a, b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    });

    if (matches.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'task-list-empty';
      empty.textContent = selectedOwners.size === 0
        ? 'Select one or more people above to see their tasks.'
        : 'No tasks found for the selected people.';
      els.taskList.appendChild(empty);
      return;
    }

    matches.forEach((s) => els.taskList.appendChild(renderTaskRow(s)));
  }

  function renderTaskRow(subtask) {
    const row = document.createElement('div');
    row.className = 'task-row';

    const name = document.createElement('div');
    name.className = 'task-row-name';
    name.textContent = subtask.name || 'Untitled subtask';
    name.addEventListener('click', () => openTaskDetail(subtask));

    const project = document.createElement('span');
    project.className = 'task-row-project';
    const projectObj = state.projects.find((p) => p.id === subtask.projectId);
    project.textContent = projectObj ? projectObj.name : 'Unassigned project';

    const owner = ownerPicker(subtask.owner, (val) => saveSubtask(subtask.id, { owner: val }));

    const due = document.createElement('button');
    due.className = 'task-row-due';
    due.textContent = subtask.dueDate ? formatDate(subtask.dueDate) : 'No date';
    if (isOverdue(subtask.dueDate, subtask.status)) due.classList.add('overdue');
    due.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'date';
      input.value = subtask.dueDate || '';
      input.className = 'task-row-due';
      due.replaceWith(input);
      input.focus();
      input.addEventListener('change', () => saveSubtask(subtask.id, { dueDate: input.value || null }));
      input.addEventListener('blur', () => render());
    });

    const status = document.createElement('select');
    status.className = `status-pill status-${subtask.status.toLowerCase().replace(/\s+/g, '-')}`;
    STATUSES.forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      if (s === subtask.status) opt.selected = true;
      status.appendChild(opt);
    });
    status.addEventListener('change', () => {
      status.className = `status-pill status-${status.value.toLowerCase().replace(/\s+/g, '-')}`;
      saveSubtask(subtask.id, { status: status.value });
    });

    row.append(name, project, owner, due, status);
    return row;
  }

  function formatDate(iso) {
    if (!iso) return null;
    const d = new Date(iso + 'T00:00:00');
    if (Number.isNaN(d.getTime())) return null;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function isOverdue(iso, status) {
    if (!iso || status === 'Completed') return false;
    return iso < new Date().toISOString().slice(0, 10);
  }

  // ---------- Column ----------

  function renderColumns() {
    els.board.innerHTML = '';
    els.boardEmpty.hidden = state.projects.length > 0;

    state.projects.forEach((project) => {
      els.board.appendChild(renderColumn(project));
    });

    els.board.appendChild(renderGhostColumn());

  function renderColumn(project) {
    const col = document.createElement('div');
    col.className = 'column';
    col.dataset.projectId = project.id;
    col.style.setProperty('--col-accent', COLOR_VARS[project.color] || 'var(--blue-500)');

    const header = document.createElement('div');
    header.className = 'column-header';

    const titleRow = document.createElement('div');
    titleRow.className = 'column-title-row';

    const title = document.createElement('div');
    title.className = 'column-title';
    title.contentEditable = 'true';
    title.spellcheck = false;
    title.textContent = project.name || 'Untitled project';
    title.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } });
    title.addEventListener('blur', () => {
      const value = title.textContent.trim() || 'Untitled project';
      title.textContent = value;
      if (value !== project.name) saveProject(project.id, { name: value });
    });

    const menuBtn = document.createElement('button');
    menuBtn.className = 'column-menu-btn';
    menuBtn.title = 'Delete project';
    menuBtn.textContent = '✕';
    menuBtn.addEventListener('click', () => deleteProject(project));

    titleRow.append(title, menuBtn);

    const meta = document.createElement('div');
    meta.className = 'column-meta';

    const ownerRow = document.createElement('div');
    ownerRow.className = 'meta-row';
    const ownerLabel = document.createElement('span');
    ownerLabel.className = 'meta-label';
    ownerLabel.textContent = 'Owner';
    ownerRow.append(ownerLabel, ownerPicker(project.owner, (val) => saveProject(project.id, { owner: val })));

    meta.appendChild(ownerRow);
    meta.appendChild(metaRow('Due', project.dueDate, 'date', (val) => saveProject(project.id, { dueDate: val })));

    header.append(titleRow, meta);

    const list = document.createElement('div');
    list.className = 'subtask-list';
    list.addEventListener('dragover', (e) => onDragOver(e, list));
    list.addEventListener('drop', (e) => onDrop(e, project.id, list));

    const subtasks = state.subtasks.filter((s) => s.projectId === project.id);
    if (subtasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'subtask-empty';
      empty.textContent = 'No subtasks yet';
      list.appendChild(empty);
    } else {
      subtasks.forEach((s, idx) => list.appendChild(renderCard(s, idx === 0, idx === subtasks.length - 1)));
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'add-subtask-btn';
    addBtn.textContent = '+ Add subtask';
    addBtn.addEventListener('click', () => createSubtask(project.id));

    col.append(header, list, addBtn);
    return col;
  }

  function metaRow(label, value, type, onSave) {
    const row = document.createElement('div');
    row.className = 'meta-row';
    const lbl = document.createElement('span');
    lbl.className = 'meta-label';
    lbl.textContent = label;

    const val = document.createElement('span');
    val.className = 'meta-value';

    val.textContent = value ? formatDate(value) : 'Set date';
    if (!value) val.classList.add('placeholder');
    if (isOverdue(value, null)) val.classList.add('overdue');
    val.tabIndex = 0;
    val.addEventListener('click', () => openDateInput(val, value, onSave));

    row.append(lbl, val);
    return row;
  }

  function openDateInput(anchor, value, onSave) {
    const input = document.createElement('input');
    input.type = 'date';
    input.value = value || '';
    input.className = 'meta-value';
    anchor.replaceWith(input);
    input.focus();
    input.addEventListener('change', () => onSave(input.value || null));
    input.addEventListener('blur', () => render());
  }

  function renderGhostColumn() {
    const col = document.createElement('div');
    col.className = 'column ghost';

    if (!addingColumn) {
      const btn = document.createElement('button');
      btn.className = 'ghost-btn';
      btn.textContent = '+ Add project';
      btn.addEventListener('click', () => { addingColumn = true; render(); });
      col.appendChild(btn);
      return col;
    }

    const form = document.createElement('div');
    form.className = 'new-column-form';
    const input = document.createElement('input');
    input.placeholder = 'Project name';
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
      if (e.key === 'Escape') { addingColumn = false; render(); }
    });
    const actions = document.createElement('div');
    actions.className = 'new-column-form-actions';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-primary';
    saveBtn.textContent = 'Add';
    saveBtn.addEventListener('click', submit);
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-ghost';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', () => { addingColumn = false; render(); });

    async function submit() {
      const name = input.value.trim();
      if (!name) return;
      const maxOrder = state.projects.reduce((m, p) => Math.max(m, p.order), 0);
      const color = COLOR_CYCLE[state.projects.length % COLOR_CYCLE.length];
      try {
        const project = await api('/api/projects', {
          method: 'POST',
          body: JSON.stringify({ name, order: maxOrder + 1, color }),
        });
        state.projects.push(project);
        addingColumn = false;
        render();
        toast('Project added');
      } catch (e) {
        toast(e.message, true);
      }
    }

    actions.append(saveBtn, cancelBtn);
    form.append(input, actions);
    col.appendChild(form);
    setTimeout(() => input.focus(), 0);
    return col;
  }

    due.addEventListener('click', () => {

      input.className = 'card-due';

      opt.textContent = s;

    status.addEventListener('change', () => {
      status.className = `status-pill status-${status.value.toLowerCase().replace(/\s+/g, '-')}`;
      saveSubtask(subtask.id, { status: status.value });

    card.append(topRow, row, status);
    return card;

  // ---------- Drag & drop ----------
  // The dragged card is physically moved in the live DOM as the cursor
  // passes over other cards (the classic "sortable list" pattern), so the
  // board itself is the landing-spot preview — no separate highlight needed.
  // Sibling cards slide out of the way with a small FLIP animation so the
  // motion reads clearly instead of snapping.

  function getDragAfterElement(container, y) {
    const items = [...container.querySelectorAll('.card-item:not(.dragging)')];
    return items.reduce(
      (closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: child };
        }
        return closest;
      },
      { offset: Number.NEGATIVE_INFINITY, element: null }
    ).element;
  }

  function flip(container, mutate) {
    const items = [...container.querySelectorAll('.card-item')];
    const firstRects = new Map(items.map((el) => [el, el.getBoundingClientRect()]));
    mutate();
    const afterItems = [...container.querySelectorAll('.card-item')];
    afterItems.forEach((el) => {
      const first = firstRects.get(el);
      if (!first) return;
      const last = el.getBoundingClientRect();
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      if (dx || dy) {
        el.style.transition = 'none';
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(() => {
          el.style.transition = 'transform 160ms ease';
          el.style.transform = '';
        });
      }
    });
  }

  function onDragOver(e, listEl) {
    e.preventDefault();
    const dragging = document.querySelector('.card-item.dragging');
    if (!dragging) return;
    const emptyPlaceholder = listEl.querySelector('.subtask-empty');
    if (emptyPlaceholder) emptyPlaceholder.remove();

    const afterEl = getDragAfterElement(listEl, e.clientY);
    if (afterEl === dragging) return;
    if (afterEl == null && listEl.lastElementChild === dragging) return;

    flip(listEl, () => {
      if (afterEl == null) listEl.appendChild(dragging);
      else listEl.insertBefore(dragging, afterEl);
    });
  }

  function onDrop(e, projectId, listEl) {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    const subtask = state.subtasks.find((s) => s.id === id);
    if (!subtask) return;

    const cardEls = [...listEl.querySelectorAll('.card-item')];
    const idx = cardEls.findIndex((el) => el.dataset.subtaskId === id);
    const prevSubtask = idx > 0 ? state.subtasks.find((s) => s.id === cardEls[idx - 1].dataset.subtaskId) : null;
    const nextSubtask = idx >= 0 && idx < cardEls.length - 1
      ? state.subtasks.find((s) => s.id === cardEls[idx + 1].dataset.subtaskId)
      : null;

    let newOrder;
    if (prevSubtask && nextSubtask) newOrder = (prevSubtask.order + nextSubtask.order) / 2;
    else if (prevSubtask) newOrder = prevSubtask.order + 1;
    else if (nextSubtask) newOrder = nextSubtask.order - 1;
    else newOrder = 1;

    subtask.projectId = projectId;
    subtask.order = newOrder;
    render();
    saveSubtask(id, { projectId, order: newOrder });
  }

  // Deterministic reorder buttons — the guaranteed-to-work alternative to
  // drag and drop. Swaps position with the adjacent sibling in the same
  // column using fractional order values (same math as the drag logic).
  let autoUpdateTimer = null;
  function scheduleAutoUpdate() {
    // Same effect as clicking the Update button, fired automatically half a
    // second after an arrow click — debounced so several quick clicks only
    // trigger one refresh, timed after the last one.
    clearTimeout(autoUpdateTimer);
    autoUpdateTimer = setTimeout(() => loadBoard(true), 500);
  }

  function moveSubtask(subtask, direction) {
    const siblings = state.subtasks
      .filter((s) => s.projectId === subtask.projectId)
      .sort((a, b) => a.order - b.order);
    const idx = siblings.findIndex((s) => s.id === subtask.id);
    if (idx === -1) return;

    let newOrder;
    if (direction === 'up') {
      if (idx === 0) return;
      const prev = siblings[idx - 1];
      const prevPrev = siblings[idx - 2];
      newOrder = prevPrev ? (prevPrev.order + prev.order) / 2 : prev.order - 1;
    } else {
      if (idx === siblings.length - 1) return;
      const next = siblings[idx + 1];
      const nextNext = siblings[idx + 2];
      newOrder = nextNext ? (next.order + nextNext.order) / 2 : next.order + 1;
    }

    subtask.order = newOrder;
    render();
    saveSubtask(subtask.id, { order: newOrder });
    scheduleAutoUpdate();
  }

  // Moves a card to another project's column, appending it at the end.
  function moveSubtaskToProject(subtask, targetProjectId) {
    if (targetProjectId === subtask.projectId) return;
    const siblings = state.subtasks.filter((s) => s.projectId === targetProjectId);
    const newOrder = siblings.length ? Math.max(...siblings.map((s) => s.order)) + 1 : 1;
    subtask.projectId = targetProjectId;
    subtask.order = newOrder;
    saveSubtask(subtask.id, { projectId: targetProjectId, order: newOrder });
    render();
  }

  // ---------- Task detail modal (description + links) ----------

  function openTaskDetail(subtask) {
    const overlay = document.createElement('div');
    overlay.className = 'detail-overlay';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

    const modal = document.createElement('div');
    modal.className = 'detail-card';

    const header = document.createElement('div');
    header.className = 'detail-header';
    const nameInput = document.createElement('input');
    nameInput.className = 'detail-name-input';
    nameInput.value = subtask.name || '';
    nameInput.addEventListener('change', () => {
      const value = nameInput.value.trim() || 'Untitled subtask';
      nameInput.value = value;
      if (value !== subtask.name) saveSubtask(subtask.id, { name: value });
    });
    const closeBtn = document.createElement('button');
    closeBtn.className = 'icon-btn';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', close);
    header.append(nameInput, closeBtn);

    const metaRow2 = document.createElement('div');
    metaRow2.className = 'detail-meta-row';

    const ownerBlock = document.createElement('div');
    ownerBlock.className = 'detail-meta-block';
    const ownerLbl = document.createElement('div');
    ownerLbl.className = 'detail-label';
    ownerLbl.textContent = 'Assigned to';
    ownerBlock.append(ownerLbl, ownerPicker(subtask.owner, (val) => saveSubtask(subtask.id, { owner: val })));

    const dueBlock = document.createElement('div');
    dueBlock.className = 'detail-meta-block';
    const dueLbl = document.createElement('div');
    dueLbl.className = 'detail-label';
    dueLbl.textContent = 'Due date';
    const dueInput = document.createElement('input');
    dueInput.type = 'date';
    dueInput.value = subtask.dueDate || '';
    dueInput.className = 'detail-date-input';
    dueInput.addEventListener('change', () => saveSubtask(subtask.id, { dueDate: dueInput.value || null }));
    dueBlock.append(dueLbl, dueInput);

    const statusBlock = document.createElement('div');
    statusBlock.className = 'detail-meta-block';
    const statusLbl = document.createElement('div');
    statusLbl.className = 'detail-label';
    statusLbl.textContent = 'Status';
    const statusSelect = document.createElement('select');
    statusSelect.className = `status-pill status-${subtask.status.toLowerCase().replace(/\s+/g, '-')}`;
    STATUSES.forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      if (s === subtask.status) opt.selected = true;
      statusSelect.appendChild(opt);
    });
    statusSelect.addEventListener('change', () => {
      statusSelect.className = `status-pill status-${statusSelect.value.toLowerCase().replace(/\s+/g, '-')}`;
      saveSubtask(subtask.id, { status: statusSelect.value });
    });
    statusBlock.append(statusLbl, statusSelect);

    const moveBlock = document.createElement('div');
    moveBlock.className = 'detail-meta-block';
    const moveLbl = document.createElement('div');
    moveLbl.className = 'detail-label';
    moveLbl.textContent = 'Project';
    const moveSelect = document.createElement('select');
    moveSelect.className = 'detail-project-select';
    state.projects.forEach((p) => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      if (p.id === subtask.projectId) opt.selected = true;
      moveSelect.appendChild(opt);
    });
    moveSelect.addEventListener('change', () => {
      const targetId = moveSelect.value;
      if (targetId === subtask.projectId) return;
      const targetProject = state.projects.find((p) => p.id === targetId);
      moveSubtaskToProject(subtask, targetId);
      toast(targetProject ? `Moved to ${targetProject.name}` : 'Moved');
      close();
    });
    moveBlock.append(moveLbl, moveSelect);

    metaRow2.append(ownerBlock, dueBlock, statusBlock, moveBlock);

    const descLbl = document.createElement('div');
    descLbl.className = 'detail-label';
    descLbl.textContent = 'Description';
    const descArea = document.createElement('textarea');
    descArea.className = 'detail-textarea';
    descArea.placeholder = 'Loading…';
    descArea.disabled = true;

    const linksLbl = document.createElement('div');
    linksLbl.className = 'detail-label';
    linksLbl.textContent = 'Links';
    const linksList = document.createElement('div');
    linksList.className = 'detail-links';
    const addLinkBtn = document.createElement('button');
    addLinkBtn.className = 'btn-ghost';
    addLinkBtn.textContent = '+ Add link';
    addLinkBtn.disabled = true;

    let links = [];

    function renderLinks() {
      linksList.innerHTML = '';
      links.forEach((url, idx) => {
        const linkRow = document.createElement('div');
        linkRow.className = 'detail-link-row';
        const urlInput = document.createElement('input');
        urlInput.type = 'url';
        urlInput.value = url;
        urlInput.placeholder = 'https://…';
        urlInput.addEventListener('change', () => {
          links[idx] = urlInput.value.trim();
          persistLinks();
        });
        const removeBtn = document.createElement('button');
        removeBtn.className = 'link-remove-btn';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', () => {
          links.splice(idx, 1);
          renderLinks();
          persistLinks();
        });
        linkRow.append(urlInput, removeBtn);
        linksList.appendChild(linkRow);
      });
    }

    function persistLinks() {
      const cleaned = links.map((l) => l.trim()).filter(Boolean);
      saveSubtask(subtask.id, { links: cleaned });
    }

    addLinkBtn.addEventListener('click', () => {
      links.push('');
      renderLinks();
    });

    descArea.addEventListener('blur', () => {
      if (descArea.value !== (subtask.description || '')) {
        saveSubtask(subtask.id, { description: descArea.value });
      }
    });

    modal.append(header, metaRow2, descLbl, descArea, linksLbl, linksList, addLinkBtn);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    function close() {
      overlay.remove();
      document.removeEventListener('keydown', escHandler);
    }
    function escHandler(e) {
      if (e.key === 'Escape') close();
    }
    document.addEventListener('keydown', escHandler);

    // Load description/links — use the cached copy if we already fetched
    // this subtask's detail earlier in the session, otherwise fetch once.
    (async () => {
      if (subtask.description === undefined) {
        try {
          const detail = await api(`/api/subtasks/${subtask.id}`);
          subtask.description = detail.description || '';
          subtask.links = detail.links || [];
        } catch (e) {
          subtask.description = '';
          subtask.links = [];
          toast('Could not load details', true);
        }
      }
      descArea.disabled = false;
      descArea.placeholder = 'Add more context about this task…';
      descArea.value = subtask.description || '';
      links = (subtask.links || []).slice();
      addLinkBtn.disabled = false;
      renderLinks();
    })();
  }

  // ---------- Mutations ----------

  async function saveProject(id, patch) {
    const project = state.projects.find((p) => p.id === id);
    if (project) Object.assign(project, patch);
    try {
      await api(`/api/projects/${id}`, { method: 'PATCH', body: JSON.stringify(patch) });
    } catch (e) {
      toast(e.message, true);
    }
  }

  async function deleteProject(project) {
    if (!confirm(`Delete "${project.name}" and all its subtasks? This can't be undone.`)) return;
    state.projects = state.projects.filter((p) => p.id !== project.id);
    state.subtasks = state.subtasks.filter((s) => s.projectId !== project.id);
    render();
    try {
      await api(`/api/projects/${project.id}`, { method: 'DELETE' });
      toast('Project deleted');
    } catch (e) {
      toast(e.message, true);
      loadBoard();
    }
  }

  async function createSubtask(projectId) {
    const siblings = state.subtasks.filter((s) => s.projectId === projectId);
    const order = siblings.length ? Math.max(...siblings.map((s) => s.order)) + 1 : 1;
    try {
      const subtask = await api('/api/subtasks', {
        method: 'POST',
        body: JSON.stringify({ name: 'New subtask', projectId, status: 'Not Started', order }),
      });
      state.subtasks.push(subtask);
      render();
    } catch (e) {
      toast(e.message, true);
    }
  }

  async function saveSubtask(id, patch) {
    const subtask = state.subtasks.find((s) => s.id === id);
    if (subtask) Object.assign(subtask, patch);
    try {
      await api(`/api/subtasks/${id}`, { method: 'PATCH', body: JSON.stringify(patch) });
    } catch (e) {
      toast(e.message, true);
    }
  }

  async function deleteSubtask(subtask) {
    state.subtasks = state.subtasks.filter((s) => s.id !== subtask.id);
    render();
    try {
      await api(`/api/subtasks/${subtask.id}`, { method: 'DELETE' });
    } catch (e) {
      toast(e.message, true);
      loadBoard();
    }
  }

  // ---------- Wiring ----------

  els.refreshBtn.addEventListener('click', () => loadBoard(true));
  els.addProjectBtn.addEventListener('click', () => { addingColumn = true; render(); });
  els.tabBoard.addEventListener('click', () => setActiveTab('board'));
  els.tabTasks.addEventListener('click', () => setActiveTab('tasks'));

  loadBoard();
  setInterval(() => loadBoard(), POLL_MS);
})();

</script>
</body>
</html>
